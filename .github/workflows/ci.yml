name: CI — Runtime & Evidence Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          test -s phi-app/index.html
          test -s phi-app/assets/nav.css
          test -s phi-app/assets/phi-shell.js
          test -s phi-app/viz/index.html
          test -s phi-app/evaluator/index.html
          test -s phi-app/docs/index.html
          grep -q '"source": "/viz/"' vercel.json
          grep -q '"source": "/evaluator/"' vercel.json
          grep -q '"source": "/docs/"' vercel.json

      - name: Verify evaluator JavaScript syntax
        run: |
          node --check api/evaluate.js
          node --check phi-app/api/evaluate.js

      - name: Verify public evidence boundary
        run: |
          grep -q "MODEL_HEURISTIC" api/evaluate.js
          grep -q "not certification" phi-app/evaluator/index.html
          grep -q "Dynamic Governance Agentic Formation" api/evaluate.js
          grep -q "SIMULATION / PROJECT-LOCAL MODEL / NOT VALIDATION" phi-app/viz/index.html
          grep -q "not an empirical sample size" phi-app/index.html
          ! grep -q '99.1%' phi-app/viz/index.html
          ! grep -q 'COMPLIANCE UPLIFT' phi-app/viz/index.html
          ! grep -q '5/5 VERIFIED' phi-app/viz/index.html
          ! grep -q 'Calibration achieved' phi-app/viz/index.html
          ! grep -Fq '${[' phi-app/index.html

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8
      - name: Lint Python sources
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,*.egg-info
      - name: Run Python tests when present
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "No Python tests/ directory present; runtime/evaluator checks are enforced in the verify job."
          fi
